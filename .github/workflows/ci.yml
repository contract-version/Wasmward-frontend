name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # package.json says Node 20 or newer, so run the tests and the build on the oldest and the newest.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      WASMWARD_CORE_DIR: ${{ github.workspace }}/Wasmward-backend
    steps:
      - uses: actions/checkout@v4
      # The library is not on npm yet, so the example is built against a checkout of its repository.
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          repository: contract-version/Wasmward-backend
          path: Wasmward-backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the library's dependencies
        working-directory: Wasmward-backend
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # No Node-only modules in the browser bundle, and it stays within its size budget.
      - name: Check the bundle
        run: node check-bundle.mjs
      # The stylesheet hash in the page's Content-Security-Policy must match the stylesheet.
      - name: Check the policy hash is current
        run: node update-csp.mjs --check
      # Where the bundle's bytes are, on the run's summary page, so growth is visible before it fails the budget.
      - name: Show what the bundle is made of
        if: matrix.node == 22
        run: |
          {
            echo '### The browser bundle'
            echo
            echo '```text'
            node check-bundle.mjs
            echo
            node analyze-bundle.mjs --top 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The demo is only as good as the contract it points at. This needs testnet, so it is its own job: a
  # testnet outage or an expiring contract fails this check without hiding whether the demo builds.
  contract-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the contract the demo depends on (at least 1 day of life left)
        uses: contract-version/Wasmward-backend@main
        with:
          config: wasmward.json
          min-ttl-days: '1'
