name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WASMWARD_CORE_DIR: ${{ github.workspace }}/Wasmward-backend
    steps:
      - uses: actions/checkout@v4
      # The library is not on npm yet, so the example is built against a checkout of its repository.
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          repository: contract-version/Wasmward-backend
          path: Wasmward-backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the library's dependencies
        working-directory: Wasmward-backend
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check the bundle
        run: |
          test -s dist/app.js
          # The browser bundle must not reach for Node-only modules.
          if grep -E -o 'from ?"(node:)?(fs|path|os|child_process)"' dist/app.js; then
            echo "dist/app.js imports a Node-only module" >&2
            exit 1
          fi
      - name: Keep the demo and its Wasmward config in step
        run: |
          # src/main.js and wasmward.json describe the same contract. They must not drift apart.
          js_id="$(sed -n "s/^const CONTRACT_ID = '\(.*\)';$/\1/p" src/main.js)"
          js_hash="$(sed -n "s/^const V1_HASH = '\(.*\)';$/\1/p" src/main.js)"
          json_id="$(node -p "require('./wasmward.json').contracts.vault.contractId")"
          json_hash="$(node -p "require('./wasmward.json').contracts.vault.supported[0].wasmHash")"
          echo "src/main.js:   $js_id $js_hash"
          echo "wasmward.json: $json_id $json_hash"
          test -n "$js_id" && test -n "$js_hash"
          test "$js_id" = "$json_id" && test "$js_hash" = "$json_hash"

  # The demo is only as good as the contract it points at. This needs testnet, so it is its own job: a
  # testnet outage or an expiring contract fails this check without hiding whether the demo builds.
  contract-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the contract the demo depends on (at least 1 day of life left)
        uses: contract-version/Wasmward-backend@main
        with:
          config: wasmward.json
          min-ttl-days: '1'
